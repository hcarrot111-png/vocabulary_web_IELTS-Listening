<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>听力词汇练习｜完整网页版</title>
<style>
:root{
  --blue:#006eeb;--blue2:#eaf4ff;--bg:#f3f7fb;--text:#111827;
  --muted:#718096;--line:#e4eaf2;--green:#18a566;--red:#e0482e;--card:#fff;
  --shadow:0 14px 44px rgba(30,50,80,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;background:#0f1724;color:white;padding:26px 16px;position:fixed;left:0;top:0;bottom:0}
.brand{font-size:22px;font-weight:800;margin:4px 14px 28px}.nav{padding:12px 18px;border-radius:10px;color:#cfd6e3;margin:6px 0}.nav.active{background:#173862;color:#fff;font-weight:700}
.content{margin-left:220px;flex:1;padding:34px 40px 44px;min-width:980px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:8px;font-size:14px}
.btn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:12px;padding:11px 18px;font-weight:700}.btn.primary{background:var(--blue);color:#fff}.btn.ghost{border-color:var(--line);color:#455269}
.panel{background:white;border-radius:22px;box-shadow:var(--shadow);padding:28px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.type-card{border:1px solid var(--line);border-radius:18px;padding:24px;min-height:248px;background:#fff;display:flex;flex-direction:column}
.type-card h3{font-size:22px;margin:0 0 8px}.desc{font-size:14px;color:var(--muted);line-height:1.6;min-height:45px}
.badge{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:#fff7cb;margin-bottom:18px;font-weight:800}
.progress-text{font-size:13px;color:var(--muted);margin-top:26px}.strong{font-weight:800;margin-top:6px}.actions{display:flex;gap:10px;margin-top:18px}
.group-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.group{border:1px solid var(--line);background:white;border-radius:12px;padding:16px 10px;font-weight:700}.group.current{border-color:#84b9ff;background:#eef6ff;color:var(--blue)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.mode{border:1px solid var(--line);border-radius:18px;padding:24px;background:white}.mode h3{font-size:22px;margin:0 0 8px}

.exercise-page{padding:28px 34px 36px}.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
.header h1{margin:0;font-size:32px}.back{border:1px solid var(--blue);color:var(--blue);background:white;border-radius:12px;padding:12px 18px;font-weight:700}
.card{position:relative;background:#fff;border-radius:24px;min-height:780px;padding:28px 42px 112px;box-shadow:var(--shadow);overflow:hidden}
.card-top{display:flex;justify-content:space-between;color:#708096;font-size:14px}
.gear{position:absolute;right:22px;top:22px;width:58px;height:58px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:26px;box-shadow:0 10px 30px rgba(0,110,235,.3);cursor:grab;z-index:20;user-select:none;touch-action:none}.gear:active{cursor:grabbing}
.main{text-align:center;padding-top:42px}.word-line{display:flex;justify-content:center;align-items:center;gap:10px}.word{font-size:50px;font-weight:800}.small-audio{border:0;background:transparent;color:var(--blue);font-size:25px}
.phon{margin-top:10px;color:#6f7b8b;font-size:18px}.pos{margin-top:10px;font-size:18px;font-weight:800}.meaning{margin-top:24px;font-size:22px;font-weight:700}
.status{margin-top:34px;color:#58687c;font-weight:700}.prompt{display:inline-block;margin-top:18px;background:var(--blue2);padding:10px 18px;border-radius:12px;color:#41556b;font-size:14px;font-weight:700}

.options{max-width:930px;margin:26px auto 0;display:grid;grid-template-columns:repeat(5,1fr);gap:26px}
.opt{border:0;background:transparent;text-align:center}.circle{width:104px;height:104px;margin:auto;border-radius:50%;background:#eaf4ff;display:grid;place-items:center;font-size:38px;border:3px solid transparent;padding:0}.opt.correct .circle{border-color:var(--green);background:#effbf5}.opt.wrong .circle{border-color:#e45e5e;background:#fff2f2}
.select-row{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:9px}.pickbox{width:24px;height:24px;border:2px solid #9fb0c5;border-radius:5px;background:#fff;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:900}.pickbox.selected{background:var(--blue);border-color:var(--blue)}.pickbox.selected::after{content:"✓"}.letter{font-weight:800}.meta{min-height:44px;margin-top:7px;font-size:13px;line-height:1.35;color:#39475b}
.feedback{margin-top:16px;min-height:22px;font-weight:800}.feedback.bad{color:var(--red)}.feedback.ok{color:var(--green)}
.analysis{max-width:1040px;margin:28px auto 0;text-align:left;background:#f7f9fc;border-radius:18px;padding:20px 22px}.analysis h3{margin:0 0 14px}.block{padding:12px 0;border-top:1px solid var(--line)}.block:first-of-type{border-top:0}.label{font-size:12px;color:#78869a;font-weight:700;margin-bottom:6px}.q{background:#fff;border-radius:12px;padding:12px}.hl{background:#ffe7a8;color:#8a5a00;padding:1px 5px;border-radius:5px;font-weight:800}
.bottom{position:absolute;left:42px;right:42px;bottom:26px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.ctrl{border:1px solid #b8d5ff;background:white;color:var(--blue);border-radius:12px;padding:12px 8px;font-weight:800}.ctrl.primary{background:var(--blue);color:#fff}.ico{display:block;font-size:20px;margin-bottom:4px}

.settings{position:absolute;width:470px;background:#fff;border-radius:22px;padding:24px 28px 28px;box-shadow:0 22px 60px rgba(20,35,55,.24);border:1px solid #edf1f6;z-index:19;display:none}.settings.show{display:block}
.settings-head{display:flex;justify-content:space-between;align-items:center}.settings-head h2{font-size:24px;margin:0}.close{border:0;background:transparent;font-size:28px}.row{padding:18px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.rowtop{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700}
.toggle{width:54px;height:30px;border-radius:16px;background:#cfd8e3;border:0;position:relative}.toggle:after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:var(--blue)}.toggle.on:after{left:28px}
.segs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.seg{border:1px solid #dfe6ef;background:#f7f9fc;border-radius:10px;padding:10px 16px;font-weight:700}.seg.sel{border-color:#7cb7ff;background:#eef6ff;color:var(--blue)}

.flash-synbox{max-width:760px;margin:34px auto 0;background:#f7f9fc;border-radius:18px;padding:20px 24px;text-align:left}.flash-synbox h3{margin:0 0 14px;font-size:17px}.flash-synrow{display:grid;grid-template-columns:1fr 1.2fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.flash-synrow:first-of-type{border-top:0}.flash-mini-audio{width:34px;height:34px;border:0;border-radius:50%;background:var(--blue2);color:var(--blue)}
.hidden-tip{display:inline-block;margin-top:28px;background:#f5f8fc;color:#78869a;padding:12px 18px;border-radius:12px}

.spell-wrap{max-width:680px;margin:42px auto 0}.spell-slots{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:26px 0}.slot{width:38px;height:46px;border-bottom:3px solid #8ca0b9;font-size:28px;font-weight:800;display:flex;align-items:flex-end;justify-content:center}.slot.bad{color:var(--red);border-color:var(--red)}
.input{width:420px;max-width:100%;height:54px;border:1px solid var(--line);border-radius:12px;padding:0 16px;background:#f8fafc;outline:none}.input:focus{border-color:#8abaff}
.spell-result{margin-top:18px;font-weight:800}

.choice-list{max-width:620px;margin:34px auto 0;display:grid;gap:14px}.choice{border:1px solid var(--line);background:#f8fafc;border-radius:12px;padding:16px 18px;text-align:left;font-size:16px}.choice.selected{border-color:var(--blue);background:#eef6ff;color:#0759b6;font-weight:800}.choice.correct{border-color:#79d0a4;background:#effbf5}.choice.wrong{border-color:#ed9b9b;background:#fff2f2}

.complete{background:white;border-radius:22px;box-shadow:var(--shadow);padding:70px;text-align:center}.complete .okmark{font-size:58px;color:var(--green);font-weight:800}.complete h2{font-size:30px;margin:18px 0 8px}

.spell-inline{
  width:min(560px,88%); margin:28px auto 0; display:flex; justify-content:center; gap:10px; flex-wrap:wrap
}
.spell-cell{
  width:54px; height:60px; border:0; border-bottom:3px solid #93a6bd; background:transparent;
  text-align:center; font-size:30px; font-weight:800; outline:none; text-transform:lowercase
}
.spell-cell:focus{border-color:var(--blue)}
.spell-cell.correct{color:var(--green);border-color:var(--green)}
.spell-cell.wrong{color:var(--red);border-color:var(--red)}
.answer-info{
  max-width:760px; margin:26px auto 0; background:#f7f9fc; border-radius:18px; padding:20px 24px; text-align:left
}
.answer-info h3{margin:0 0 14px;font-size:18px}
.info-line{padding:12px 0;border-top:1px solid var(--line)}
.info-line:first-of-type{border-top:0}
.example-box{background:#fff;border-radius:12px;padding:12px;margin-top:8px}


.done-card{
  background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:70px 40px;text-align:center;min-height:620px
}
.done-icon{
  width:84px;height:84px;border-radius:50%;margin:0 auto 22px;background:#ecfbf4;color:var(--green);
  display:grid;place-items:center;font-size:42px;font-weight:900
}
.done-title{font-size:32px;font-weight:800;margin-bottom:10px}
.done-sub{color:var(--muted);font-size:15px}
.done-stats{display:flex;justify-content:center;gap:18px;margin:36px 0}
.done-stat{width:190px;background:#f7f9fc;border-radius:16px;padding:22px}
.done-stat .num{font-size:30px;font-weight:800;margin-top:8px}
.done-actions{display:flex;justify-content:center;gap:14px;margin-top:26px}


.correct-word-display{
  margin:18px auto 0;
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 16px;
  border-radius:12px;
  background:#eef6ff;
  color:#0b5eb8;
  font-size:18px;
  font-weight:800;
}

@media(max-width:1100px){.grid3{grid-template-columns:1fr}.group-grid{grid-template-columns:repeat(4,1fr)}.options{gap:12px}.circle{width:84px;height:84px}.settings{width:420px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">智能平台</div>
    <div class="nav">首页</div><div class="nav active">词汇书</div><div class="nav">听力练习</div><div class="nav">错题本</div><div class="nav">学习报告</div>
  </aside>
  <main class="content">
    <section id="listView">
      <div class="topbar"><div><h1>听力词汇练习</h1><div class="sub">选择词汇类型，继续上次进度或选择其他词组</div></div></div>
      <div class="grid3">
        <div class="type-card"><div class="badge">A</div><h3>考点词</h3><div class="desc">高频考点词及其同义替换。</div><div class="progress-text">上次学习</div><div class="strong">第12组</div><div class="actions"><button class="btn primary" onclick="openType('key',12)">继续学习</button><button class="btn" onclick="showGroups('key')">选择其他组</button></div></div>
        <div class="type-card"><div class="badge" style="background:#eef5ff">B</div><h3>答案词</h3><div class="desc">听音识别答案词，并训练完整、准确的拼写。</div><div class="progress-text">上次学习</div><div class="strong">第8组</div><div class="actions"><button class="btn primary" onclick="openType('answer',8)">继续学习</button><button class="btn" onclick="showGroups('answer')">选择其他组</button></div></div>
        <div class="type-card"><div class="badge" style="background:#eef5ff">C</div><h3>话题词</h3><div class="desc">训练听到话题词后快速建立声音—词义对应。</div><div class="progress-text">上次学习</div><div class="strong">第5组</div><div class="actions"><button class="btn primary" onclick="openType('topic',5)">继续学习</button><button class="btn" onclick="showGroups('topic')">选择其他组</button></div></div>
      </div>
    </section>

    <section id="groupView" class="hidden">
      <div class="topbar"><div><h1 id="groupTitle"></h1><div class="sub">选择词组</div></div><button class="btn ghost" onclick="showView('listView')">← 返回</button></div>
      <div class="panel"><div class="group-grid" id="groupGrid"></div></div>
    </section>

    <section id="modeView" class="hidden">
      <div class="topbar"><div><h1 id="modeTitle"></h1><div class="sub">选择本组练习方式</div></div><button class="btn ghost" onclick="showGroups(currentType)">← 返回词组</button></div>
      <div class="mode-grid" id="modeGrid"></div>
    </section>

    <section id="exerciseView" class="hidden"></section>
    <section id="doneView" class="hidden"></section>
  </main>
</div>

<script>
let currentType='key',selectedGroup=12;

const keyData=[
 {word:'incorporate',phon:'/ɪnˈkɔːpəreɪt/',pos:'v.',meaning:'包含；纳入；合并',opts:[{en:'include',zh:'包括；包含',correct:true},{en:'comprise',zh:'由……组成；包含',correct:true},{en:'contain',zh:'包含；容纳',correct:true},{en:'integrate',zh:'整合；使成为一体',correct:true},{en:'exclude',zh:'排除；不包括',correct:false}],question:'The new course will ______ practical training into the existing programme.',source:'The new course will incorporate practical training into the existing programme.',translation:'这门新课程将把实践培训纳入现有课程体系。',translationHighlights:['把','纳入']},
 {word:'purchase',phon:'/ˈpɜːtʃəs/',pos:'v.',meaning:'购买',opts:[{en:'buy',zh:'购买',correct:true},{en:'acquire',zh:'获得；购得',correct:true},{en:'obtain',zh:'获得',correct:true},{en:'get',zh:'获得；得到',correct:true},{en:'sell',zh:'出售',correct:false}],question:'Visitors can ______ tickets at the front desk.',source:'Visitors can purchase tickets at the front desk.',translation:'访客可以在前台购票。',translationHighlights:['购票']}
];

const keySynData=[
 {word:'incorporate',phon:'/ɪnˈkɔːpəreɪt/',pos:'v.',meaning:'包含；纳入；合并',opts:[{en:'include',zh:'包括；包含',correct:true},{en:'comprise',zh:'由……组成；包含',correct:true},{en:'contain',zh:'包含；容纳',correct:true},{en:'integrate',zh:'整合；使成为一体',correct:true},{en:'exclude',zh:'排除；不包括',correct:false}],question:'The new course will ______ practical training into the existing programme.',source:'The new course will incorporate practical training into the existing programme.',translation:'这门新课程将把实践培训纳入现有课程体系。',translationHighlights:['把','纳入']},
 {word:'purchase',phon:'/ˈpɜːtʃəs/',pos:'v.',meaning:'购买',opts:[{en:'buy',zh:'购买',correct:true},{en:'acquire',zh:'获得；购得',correct:true},{en:'obtain',zh:'获得',correct:true},{en:'get',zh:'获得；得到',correct:true},{en:'sell',zh:'出售',correct:false}],question:'Visitors can ______ tickets at the front desk.',source:'Visitors can purchase tickets at the front desk.',translation:'访客可以在前台购票。',translationHighlights:['购票']},
 {word:'require',phon:'/rɪˈkwaɪə(r)/',pos:'v.',meaning:'需要；要求',opts:[{en:'need',zh:'需要',correct:true},{en:'demand',zh:'要求；需要',correct:true},{en:'call for',zh:'需要；要求',correct:true},{en:'necessitate',zh:'使成为必要',correct:true},{en:'avoid',zh:'避免',correct:false}],question:'The position will ______ previous work experience.',source:'The position will require previous work experience.',translation:'这个岗位需要有以往的工作经验。',translationHighlights:['需要']}
];


const answerData=[
 {word:'music',phon:'/ˈmjuːzɪk/',pos:'n.',meaning:'音乐',example:'She listens to music while studying.',translation:'她学习时会听<span class="hl">音乐</span>。'},
 {word:'station',phon:'/ˈsteɪʃn/',pos:'n.',meaning:'车站',example:'The station is only five minutes away.',translation:'车站离这里只有五分钟路程。'},
 {word:'garden',phon:'/ˈɡɑːdn/',pos:'n.',meaning:'花园',example:'There is a small garden behind the house.',translation:'房子后面有一个小花园。'}
];
const topicData=[
 {word:'accommodation',phon:'/əˌkɒməˈdeɪʃn/',pos:'n.',meaning:'住宿；住处',options:['住宿；住处','交通；运输','设备；器材','预约；预订'],example:'The hotel provides comfortable accommodation for all guests.',translation:'这家酒店为所有客人提供舒适的<span class="hl">住宿</span>。'},
 {word:'transport',phon:'/ˈtrænspɔːt/',pos:'n.',meaning:'交通；运输',options:['环境；生态','交通；运输','费用；价格','登记；注册'],example:'Public transport is available from the airport to the city centre.',translation:'从机场到市中心有公共交通可乘坐。'},
 {word:'reservation',phon:'/ˌrezəˈveɪʃn/',pos:'n.',meaning:'预约；预订',options:['维修；保养','路线；路径','预约；预订','材料；原料'],example:'You should make a reservation before visiting the restaurant.',translation:'去这家餐厅之前你应该先预订。'}
];

const state={
 index:0,selected:new Set(),submitted:false,analysis:false,auto:true,speed:1,interval:1,count:'1次',paused:false,
 showMeaning:true,showSynonyms:true,reveal:false,answerShowMeaning:true
};

function showView(id){['listView','groupView','modeView','exerciseView','doneView'].forEach(v=>document.getElementById(v).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function typeName(t){return t==='key'?'考点词':t==='answer'?'答案词':'话题词'}
function defaultGroup(t){return t==='key'?12:t==='answer'?8:5}

function showGroups(t){
 currentType=t;showView('groupView');
 document.getElementById('groupTitle').textContent=typeName(t)+' · 选择词组';
 const cur=defaultGroup(t);
 document.getElementById('groupGrid').innerHTML=Array.from({length:18},(_,i)=>i+1).map(n=>`<button class="group ${n===cur?'current':''}" onclick="openType('${t}',${n})">第${n}组</button>`).join('');
}
function openType(t,g){
 currentType=t;selectedGroup=g;showView('modeView');
 document.getElementById('modeTitle').textContent=`第${g}组 · ${typeName(t)}`;
 const modes=t==='key'
  ?[['刷词速记','快速听音，复习释义和同义替换','key-flash'],['同替练习','听主词条后，从5个音频中多选同义替换','key-syn']]
  :t==='answer'
  ?[['刷词速记','快速听音并熟悉答案词','answer-flash'],['拼写练习','听音后根据字母数量完整拼写答案词','answer-spell']]
  :[['刷词速记','快速听音并记忆话题词含义','topic-flash'],['词义速记','只听发音，选择正确的中文含义','topic-meaning']];
 document.getElementById('modeGrid').innerHTML=modes.map(m=>`<div class="mode"><h3>${m[0]}</h3><div class="desc">${m[1]}</div><div class="actions"><button class="btn primary" onclick="startMode('${m[2]}')">进入练习</button></div></div>`).join('');
}

function resetItem(){state.selected=new Set();state.submitted=false;state.analysis=false;state.reveal=false;state.paused=false}
function startMode(mode){state.mode=mode;state.index=0;resetItem();showView('exerciseView');renderExercise()}
function speak(t,rate=state.speed){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=rate;speechSynthesis.speak(u)}
function currentData(){if(state.mode==='key-syn')return keySynData[state.index%keySynData.length];if(state.mode.startsWith('key'))return keyData[state.index%keyData.length];if(state.mode.startsWith('answer'))return answerData[state.index%answerData.length];return topicData[state.index%topicData.length]}

function settingsHTML(extra=''){
 return `<div class="settings" id="settings"><div class="settings-head"><h2>⚙ 练习设置</h2><button class="close" id="closeSettings">×</button></div>
   <div class="row"><div class="rowtop"><span>自动发音</span><button class="toggle ${state.auto?'on':''}" id="autoToggle"></button></div></div>
   ${extra}
   <div class="row"><div class="rowtop"><span>播放速度</span></div><div class="segs" id="speedSegs">${[0.5,1,1.2,1.5,2].map(v=>`<button class="seg ${state.speed===v?'sel':''}" data-v="${v}">${v}×</button>`).join('')}</div></div>
   <div class="row"><div class="rowtop"><span>播放间隔</span></div><div class="segs" id="intervalSegs">${[1,2,3,5].map(v=>`<button class="seg ${state.interval===v?'sel':''}" data-v="${v}">${v}秒</button>`).join('')}</div></div>
   <div class="row"><div class="rowtop"><span>播放次数</span></div><div class="segs" id="countSegs">${['1次','2次','单词循环','本组循环'].map(v=>`<button class="seg ${state.count===v?'sel':''}" data-v="${v}">${v}</button>`).join('')}</div></div>
 </div>`;
}

function highlightChineseAnswer(sentence,fragments=[]){
 let result=sentence;
 fragments.forEach(f=>{
   if(!f)return;
   const escaped=f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

 });
 return result;
}

 commonBottom([

   '<button class="ctrl" id="answerReplay"><span class="ico">↻</span>再听一遍</button>'
 ]);

 wireBase();

 const cells=[...document.querySelectorAll('.spell-cell')];

 // User types directly on the underlines.
 cells.forEach((cell,i)=>{
   cell.addEventListener('input',()=>{
     cell.value=cell.value.slice(-1).toLowerCase();
     if(cell.value && i<cells.length-1) cells[i+1].focus();
   });
   cell.addEventListener('keydown',e=>{
     if(e.key==='Backspace' && !cell.value && i>0) cells[i-1].focus();
   });
 });

 if(cells[0]) cells[0].focus();

 document.getElementById('spellSubmit').onclick=()=>{
   state.submitted=true;
   const typed=cells.map(c=>c.value.toLowerCase());
   cells.forEach((c,i)=>{
     c.classList.remove('correct','wrong');
     c.classList.add(typed[i]===d.word[i]?'correct':'wrong');
     c.disabled=true;
   });
   const ok=typed.join('')===d.word;
   const meaningInline=document.getElementById('answerMeaningInline');
   if(meaningInline) meaningInline.innerHTML=` <span style="margin-left:14px;font-weight:700">${d.meaning}</span>`;
   const r=document.getElementById('spellResult');
   r.style.color=ok?'var(--green)':'var(--red)';
   r.textContent=ok?'✓ 拼写正确':'拼写完成：绿色为正确字母，红色为错误字母。';

   if(!document.querySelector('.correct-word-display')){
     const answer=document.createElement('div');
     answer.className='correct-word-display';
     answer.textContent='正确答案：'+d.word;
     r.insertAdjacentElement('afterend',answer);
   }

   // Append all answer-word information after checking.
   if(!document.querySelector('.answer-info')){
     const info=document.createElement('div');
     info.className='answer-info';
     info.innerHTML=`
       <div class="info-line" style="border-top:0">
         <div class="label">例句</div>
         <div class="example-box">${highlightExample(d.example,d.word)}</div>
       </div>
       <div class="info-line">
         <div class="label">例句中文翻译</div>
         <div>${d.translation}</div>
       </div>`;
     document.querySelector('.spell-wrap').appendChild(info);
   }
 };

 document.getElementById('answerReplay').onclick=()=>{
   state.submitted=false;
   renderAnswerSpell();
   setTimeout(()=>speak(d.word),160);
 };

 const toggle=document.getElementById('answerMeaningToggle');
 if(toggle){
   toggle.onclick=()=>{
     state.answerShowMeaning=!state.answerShowMeaning;
     renderAnswerSpell();
   };
 }
}

function wireBase(){
 setupSettings();
 const prev=document.getElementById('prev'),next=document.getElementById('next');
 if(prev)prev.onclick=()=>{if(state.index>0){state.index--;resetItem();renderExercise()}};
 if(next)next.onclick=()=>{
   if(state.mode==='topic-meaning'){
     if(state.index < topicData.length-1){
       state.index++;
       resetItem();
       renderTopicMeaning();
     }else{
       showTopicMeaningDone();
     }
     return;
   }

   if(state.mode==='key-syn'){
     if(state.index < keySynData.length-1){
       state.index++;
       resetItem();
       renderKeySyn();
     }else{
       showKeySynDone();
     }
     return;
   }

   if(state.mode==='answer-spell'){
     if(state.index < answerData.length-1){
       state.index++;
       resetItem();
       renderAnswerSpell();
     }else{
       showAnswerDone();
     }
     return;
   }

   if(state.mode==='key-flash'){
     if(state.index < keyData.length-1){
       state.index++;
       resetItem();
       renderKeyFlash();
     }else{
       showKeyFlashDone();
     }
     return;
   }

   if(state.mode==='answer-flash'){
     if(state.index < answerData.length-1){
       state.index++;
       resetItem();
       renderAnswerFlash();
     }else{
       showAnswerFlashDone();
     }
     return;
   }

   if(state.mode==='topic-flash'){
     if(state.index < topicData.length-1){
       state.index++;
       resetItem();
       renderTopicFlash();
     }else{
       showTopicFlashDone();
     }
     return;
   }

   state.index=(state.index+1)%3;
   resetItem();
   renderExercise();
 };
 if(state.auto)setTimeout(()=>speak(currentData().word),180);
}
function setupSettings(){
 const card=document.getElementById('card'),gear=document.getElementById('gear'),settings=document.getElementById('settings');
 let drag=false,moved=false,sx=0,sy=0,ox=0,oy=0;
 function place(){let left=gear.offsetLeft+gear.offsetWidth+12,top=gear.offsetTop;if(left+settings.offsetWidth>card.clientWidth-14)left=gear.offsetLeft-settings.offsetWidth-12;if(left<14)left=14;if(top+settings.offsetHeight>card.clientHeight-14)top=card.clientHeight-settings.offsetHeight-14;if(top<14)top=14;settings.style.left=left+'px';settings.style.top=top+'px'}
 gear.addEventListener('pointerdown',e=>{drag=true;moved=false;sx=e.clientX;sy=e.clientY;ox=gear.offsetLeft;oy=gear.offsetTop;gear.setPointerCapture(e.pointerId)});
 gear.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;const x=Math.max(8,Math.min(card.clientWidth-gear.offsetWidth-8,ox+dx));const y=Math.max(8,Math.min(card.clientHeight-gear.offsetHeight-8,oy+dy));gear.style.left=x+'px';gear.style.top=y+'px';gear.style.right='auto';if(settings.classList.contains('show'))place()});
 gear.addEventListener('pointerup',()=>{drag=false;if(!moved){settings.classList.toggle('show');if(settings.classList.contains('show'))place()}});
 document.getElementById('closeSettings').onclick=()=>settings.classList.remove('show');
 document.getElementById('autoToggle').onclick=()=>{state.auto=!state.auto;renderExercise()};
 document.querySelectorAll('#speedSegs .seg').forEach(b=>b.onclick=()=>{state.speed=+b.dataset.v;renderExercise()});
 document.querySelectorAll('#intervalSegs .seg').forEach(b=>b.onclick=()=>{state.interval=+b.dataset.v;renderExercise()});
 document.querySelectorAll('#countSegs .seg').forEach(b=>b.onclick=()=>{state.count=b.dataset.v;renderExercise()});
}
</script>
